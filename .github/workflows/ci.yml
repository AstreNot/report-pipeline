name: ci
on: [push, pull_request]
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      REPORT_DUMMY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pipeline.py
      - run: python -m pytest -q
